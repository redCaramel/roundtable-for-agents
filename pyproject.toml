[project]
name = "roundtable-for-agents"
version = "0.1.0"
description = "Claude 에이전트 여러 명이 주제를 두고 대화하는 Windows용 GUI 프로그램"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 실제 Claude를 호출하는 테스트 — 구독 로그인 필요, 한도 차감 (기본 제외, `pytest -m live`)",
]
addopts = "-m 'not live'"
